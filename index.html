<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Encabezado -->
    <header class="app-header">
        <div class="header-content">
            <h1>Habit Tracker</h1>

            <div class="header-actions">
                <!-- Botón visual; la función de modo oscuro se añadirá más adelante -->
                <button id="theme-toggle" class="icon-btn" type="button" title="Modo oscuro" aria-label="Modo oscuro">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"></path>
                    </svg>
                </button>

                <!-- Botón visual; la ayuda se desarrollará más adelante -->
                <button id="help-toggle" class="icon-btn help-btn" type="button" title="Ayuda" aria-label="Ayuda">?</button>
            </div>
        </div>
    </header>

    <div class="app-container">
        <main>
            <form id="habit-form" class="habit-form">
                <div class="emoji-selector-container">
                    <input type="text" id="habit-emoji" class="emoji-input" placeholder="+" readonly required aria-label="Elegir emoji">
                    <div id="emoji-panel" class="emoji-panel hidden"></div>
                </div>

                <input type="text" id="habit-input" class="text-input" placeholder="Ej. Leer 10 páginas..." required autocomplete="off" aria-label="Nombre del hábito">

                <div class="color-picker">
                    <label class="color-swatch" style="background-color: #8A9A5B;">
                        <input type="radio" name="habit-color" value="#8A9A5B" checked aria-label="Verde">
                    </label>
                    <label class="color-swatch" style="background-color: #6082B6;">
                        <input type="radio" name="habit-color" value="#6082B6" aria-label="Azul">
                    </label>
                    <label class="color-swatch" style="background-color: #E2725B;">
                        <input type="radio" name="habit-color" value="#E2725B" aria-label="Coral">
                    </label>
                    <label class="color-swatch" style="background-color: #DDA0DD;">
                        <input type="radio" name="habit-color" value="#DDA0DD" aria-label="Lila">
                    </label>
                </div>

                <button type="submit">Agregar</button>
            </form>

            <div class="view-controls">
                <label for="view-selector">Vista del mapa:</label>
                <select id="view-selector" class="view-selector">
                    <option value="weekly" selected>Últimos 7 días</option>
                    <option value="monthly">Últimos 30 días</option>
                    <option value="yearly">Último año</option>
                </select>
            </div>

            <div id="habit-list" class="habit-list"></div>
        </main>
    </div>

    <!-- Pie de página -->
    <footer class="app-footer">
        <div class="footer-content">
            <span class="footer-author">By Agus Müller</span>

            <a href="https://github.com/Muller-Agustin" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 .3a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.42-4.04-1.42-.55-1.4-1.33-1.77-1.33-1.77-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.3c0 .32.22.7.83.58A12 12 0 0 0 12 .3Z"></path>
                </svg>
                <span>GitHub</span>
            </a>

            <a href="https://x.com/repoositorio" target="_blank" rel="noopener noreferrer" aria-label="X">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.4l-5.8-7.58-6.63 7.58H.47l8.6-9.83L0 1.15h7.59l5.24 6.93Zm-1.29 19.49h2.04L6.48 3.24H4.29Z"></path>
                </svg>
                <span>X</span>
            </a>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
